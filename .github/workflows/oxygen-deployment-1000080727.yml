name: Storefront 1000080727
on: [push]

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Deploy to Oxygen
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          check-latest: true

      # The repo pins yarn 3.6.4 via package.json#packageManager and tracks
      # yarn.lock (package-lock.json is gitignored), so `npm ci` cannot run
      # here. Corepack picks the pinned yarn automatically.
      - name: Enable corepack (pinned yarn)
        run: corepack enable

      - name: Cache yarn
        uses: actions/cache@v4
        with:
          path: .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build and Publish to Oxygen
        run: yarn shopify hydrogen deploy
        env:
          SHOPIFY_HYDROGEN_DEPLOYMENT_TOKEN: ${{ secrets.OXYGEN_DEPLOYMENT_TOKEN_1000080727 }}
